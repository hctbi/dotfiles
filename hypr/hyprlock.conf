background {
    monitor =
    path = $HOME/wallpaper/wallpaper
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(595959aa) rgba(595959aa) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color =r gba(ff6633ee) rgba(ff0066ee) 40deg
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    placeholder_text = Digite sua senha

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = Bem vindo, $USER.
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = JetBrainsMonoNL Nerd Font Mono

    position = 0, 80
    halign = center
    valign = center
}


label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(200, 200, 200, 1.0)
    font_size = 55
    font_family = JetBrainsMonoNL Nerd Font Mono

    position = -100, 40
    halign = right
    valign = bottom
}
